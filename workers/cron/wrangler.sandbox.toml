# SANDBOX cron Worker — same code as wrangler.toml, but a DIFFERENT worker name and pointed at the
# sandbox test site (Cloudflare Pages) instead of production. Deployed BY HAND (not by
# .github/workflows/sandbox.yml) and live, calling https://belle-mare-sandbox.pages.dev.
#
# What it does there: every 5 minutes it runs maintenance (expires holds, reconciles payments against
# the Peach TEST api, rolls the bookable dates forward). Every 2 minutes it runs the email drain, which
# FAILS CLOSED: the sandbox has no mail provider (emailConfigured:false in /api/v1/health), so queued
# emails are marked `failed` and nothing is ever sent. If a Resend key is ever added to the sandbox,
# clear `notification_outbox` first, or retried rows would be sent to the fake @sandbox.test customers.
# See docs/handbook/sandbox.md.
#
# Deploy from the repo root — always with THIS config (the root wrangler.toml is the Pages project):
#
#   npx wrangler deploy --config workers/cron/wrangler.sandbox.toml
#
# A deploy keeps the Worker's existing INTERNAL_TASK_SECRET. Only if pings return 401, set it again:
#
#   printf '%s' "$INTERNAL_TASK_SECRET" | npx wrangler secret put INTERNAL_TASK_SECRET --config workers/cron/wrangler.sandbox.toml
#
# The secret MUST match INTERNAL_TASK_SECRET on the sandbox Pages project (SANDBOX_INTERNAL_TASK_SECRET).
# Verify with `npx wrangler tail --config workers/cron/wrangler.sandbox.toml`: `-> 200` on both paths.
# Prod's gytm-cron is unaffected. SITE_URL below must be the sandbox site's real address.

name = "gytm-cron-sandbox"
main = "src/index.js"
compatibility_date = "2025-02-01"

[triggers]
crons = ["*/2 * * * *", "*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
SITE_URL = "https://belle-mare-sandbox.pages.dev"
